name: Build & deploy

# Every push to main publishes the web app (GitHub Pages), which the in-app
# update button pulls from. Add "[apk]" to a commit message, or run this
# workflow by hand, to also build a new Android APK release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir site
          cp index.html app.html version.json manifest.webmanifest sw.js site/
          cp -r icons site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html app.html version.json manifest.webmanifest www/
          cp -r icons www/

      - name: Create Android project (Capacitor)
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/filesystem@latest @capacitor/share@latest @capacitor/browser@latest
          npx cap add android
          npx --yes @capacitor/assets@latest generate --android \
            --iconBackgroundColor '#0A0C10' --iconBackgroundColorDark '#0A0C10' \
            --splashBackgroundColor '#0A0C10' --splashBackgroundColorDark '#0A0C10' \
            || echo "::warning::Icon generation failed, using default icons"
          npx cap sync android

      - name: Set app version
        run: |
          V=$(node -p "require('./version.json').apk_version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "APKV=$V" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        id: sign
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::warning::Add the KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions) to publish APKs from GitHub."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks signing/release.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias secondbrain --out second-brain.apk aligned.apk
          "$BT/apksigner" verify second-brain.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Save APK in the repo (download link + in-app APK update)
        if: steps.sign.outputs.signed == 'true'
        run: |
          mkdir -p dist && cp second-brain.apk dist/second-brain.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/second-brain.apk
          git commit -m "Android APK ${{ env.APKV }} [skip ci]" && git push || echo "APK unchanged"

      - if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.APKV }}
          name: Second Brain for Android ${{ env.APKV }}
          body: Install second-brain.apk on your Android phone. After that, app updates arrive through the update button inside the app.
          files: second-brain.apk
          make_latest: true
