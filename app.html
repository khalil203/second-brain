<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Second Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2EE;--bg2:#FFFFFF;--card:rgba(255,255,255,.82);--solid:#FFFFFF;--ink:#14161B;--mut:#5F6674;--faint:#9AA0AC;
  --line:rgba(20,22,27,.09);--acc:#0E9E7C;--accInk:#FFFFFF;--acc2:rgba(14,158,124,.11);--warm:#C77700;--bad:#D93B3B;--good:#16A34A;
  --sh1:0 1px 2px rgba(20,22,27,.05),0 8px 24px -14px rgba(20,22,27,.2);
  --sh2:0 2px 6px rgba(20,22,27,.06),0 24px 50px -22px rgba(20,22,27,.32);
  --ambient:radial-gradient(1100px 560px at 90% -12%,var(--acc2),transparent 60%);
  --r:18px;--ease:cubic-bezier(.2,.8,.2,1);
  --font:"Inter","IBM Plex Sans Thai","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabH:64px;--safeB:env(safe-area-inset-bottom);
}
:root.dark{
  --bg:#0A0C10;--bg2:#10141B;--card:rgba(24,29,38,.72);--solid:#161B23;--ink:#ECEEF2;--mut:#8F97A6;--faint:#5E6676;
  --line:rgba(255,255,255,.08);--warm:#FFB547;--bad:#FF6464;--good:#4ADE80;
  --sh1:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -16px rgba(0,0,0,.8);
  --sh2:0 1px 0 rgba(255,255,255,.05) inset,0 30px 60px -24px rgba(0,0,0,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
html{background:var(--bg)}
body{background:var(--ambient),var(--bg);background-attachment:fixed;min-height:100vh;overflow-x:hidden;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}

/* ---------- shell ---------- */
.shell{transition:transform .38s var(--ease),filter .38s,opacity .38s;transform-origin:50% 30%}
body.sheet-open .shell{transform:scale(.94);filter:blur(2px);opacity:.55}
#view{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(var(--tabH) + var(--safeB) + 40px);min-height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 0 4px;position:sticky;top:0;z-index:4;background:linear-gradient(var(--bg) 75%,transparent);margin:0 -16px;padding-left:16px;padding-right:16px}
.topbar h1{flex:1;margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.sub{color:var(--mut);font-size:13.5px;margin:-2px 0 6px}
.ib{width:42px;height:42px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--sh1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .15s var(--ease);position:relative;text-decoration:none;color:var(--ink)}
.ib:active{transform:scale(.9)}
.ib.flat{border:0;box-shadow:none;background:transparent}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--accInk);font-weight:800;font-size:17px;border:0;cursor:pointer;position:relative;box-shadow:0 8px 20px -10px var(--acc)}
.sdot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg);background:var(--faint)}
.sdot.ok{background:var(--good)}.sdot.busy{background:var(--warm);animation:beat 1s infinite}.sdot.err{background:var(--bad)}
@keyframes beat{50%{opacity:.4}}

/* ---------- tab bar + FAB ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 10px calc(var(--safeB) + 8px);pointer-events:none;transition:transform .38s var(--ease)}
body.sheet-open .tabbar{transform:translateY(130%)}
.tabbar nav{pointer-events:auto;max-width:520px;margin:0 auto;height:var(--tabH);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh2);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px/1 var(--font);color:var(--faint);cursor:pointer;padding:8px 0;transition:color .2s}
.tab svg{width:24px;height:24px;transition:transform .25s var(--ease)}
.tab.on{color:var(--acc)}
.tab.on svg{transform:translateY(-2px) scale(1.08)}
.fab{justify-self:center;width:60px;height:60px;border-radius:22px;border:0;background:var(--acc);color:var(--accInk);font-size:30px;font-weight:300;cursor:pointer;transform:translateY(-14px);box-shadow:0 14px 30px -10px var(--acc),0 0 0 6px var(--bg);transition:transform .2s var(--ease)}
.fab:active{transform:translateY(-14px) scale(.9)}
.fab svg{width:28px;height:28px}

/* ---------- cards & sections ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 8px}
.sec h2{margin:0;font-size:17px;font-weight:750;letter-spacing:-.015em}
.sec a,.link{color:var(--acc);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;background:none;border:0;padding:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px}
.panel + .panel{margin-top:10px}
.sw{position:relative;margin:8px 0;border-radius:var(--r);overflow:hidden}
.sw-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-weight:700;font-size:14px;color:#fff;border-radius:var(--r);opacity:0}
.sw-bg .l{color:var(--accInk)}
.sw.swl .sw-bg{opacity:1;background:var(--acc)}
.sw.swr .sw-bg{opacity:1;background:var(--warm)}
.sw.swl .sw-bg .r,.sw.swr .sw-bg .l{visibility:hidden}
.card{position:relative;background:var(--solid);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;box-shadow:var(--sh1);transition:transform .3s var(--ease);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card.drag{transition:none}
.card .b{flex:1;min-width:0}
.card h3{margin:2px 0 0;font-size:15.5px;font-weight:650;letter-spacing:-.01em;overflow-wrap:anywhere;line-height:1.35}
.card p{margin:3px 0 0;color:var(--mut);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .thumb{width:62px;height:62px;border-radius:12px;object-fit:cover;flex:none;background:var(--line)}
.kick{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--mut);letter-spacing:.02em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.meta{font-size:12px;color:var(--faint);margin-top:7px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.due{padding:1px 7px;border-radius:6px;background:var(--acc2);color:var(--acc);font-weight:700;text-transform:none;letter-spacing:0}
.due.late{background:rgba(217,59,59,.12);color:var(--bad)}
.done h3{text-decoration:line-through;color:var(--faint)}
.tick{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;margin:1px 0 0;border-radius:8px;border:2px solid var(--faint);cursor:pointer;display:grid;place-items:center;transition:all .2s var(--ease);background:transparent}
.tick:checked{background:var(--acc);border-color:var(--acc)}
.tick:checked::after{content:"";width:6px;height:11px;border:solid var(--accInk);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.prio{color:var(--bad);font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .sw{margin:0}
.grid .card{flex-direction:column;height:100%}
.grid .card .thumb{width:100%;height:96px;order:-1}
.grid .card p{-webkit-line-clamp:3}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:200px;scroll-snap-align:start;background:var(--solid);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:6px;min-height:118px}
.mini h4{margin:0;font-size:15px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini p{margin:0;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--mut);text-align:center;padding:34px 16px;font-size:14.5px}
.empty b{display:block;font-size:34px;margin-bottom:6px}
.anim > *{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* ---------- home ---------- */
.hero{position:relative;height:190px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 90% at 78% 50%,var(--acc2),transparent 60%),var(--card);box-shadow:var(--sh2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.hero-t{position:absolute;left:18px;top:16px;bottom:16px;right:44%;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.wx{display:flex;align-items:center;gap:10px}
.wx .ic{font-size:34px;line-height:1}
.wx b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.wx small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}
.kicker{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 4px 9px;text-align:center;box-shadow:var(--sh1);cursor:pointer;border-width:1px}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--mut);font-weight:550}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;font:600 12px/1.1 var(--font);cursor:pointer;box-shadow:var(--sh1);transition:transform .15s var(--ease)}
.qa button:active{transform:scale(.94)}
.qa i{font-style:normal;font-size:22px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--acc2)}
.banner{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--warm);border-radius:16px;padding:9px 9px 9px 14px;margin-top:10px;font-size:14px;box-shadow:var(--sh1)}
.banner span{flex:1}

/* ---------- controls ---------- */
input,select,textarea{font:inherit;color:var(--ink);background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc2)}
.search{position:relative;margin:4px 0 10px}
.search input{padding-left:40px;border-radius:16px;background:var(--card);box-shadow:var(--sh1)}
.search::before{content:"";position:absolute;left:14px;top:50%;width:14px;height:14px;margin-top:-9px;border:2px solid var(--faint);border-radius:50%}
.search::after{content:"";position:absolute;left:27px;top:50%;width:7px;height:2px;margin-top:5px;background:var(--faint);transform:rotate(45deg)}
.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--acc);color:var(--accInk);font:700 15px/1.2 var(--font);cursor:pointer;box-shadow:0 10px 24px -12px var(--acc);transition:transform .15s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.96)}
.btn.g{background:var(--solid);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh1)}
.btn.r{background:var(--bad);color:#fff;box-shadow:none}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 13.5px/1.2 var(--font);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,transform .15s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);border-color:transparent;color:var(--bg)}
.chip small{opacity:.6;margin-left:4px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 10px;border-radius:9px;font:600 13px/1.2 var(--font);cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:var(--sh1)}
.toolrow{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.toolrow .seg{flex:none}
.toolrow .grow{flex:1}
label.sw2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-size:15px;border-bottom:1px solid var(--line)}
label.sw2 input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none;border:0;padding:0}
label.sw2 input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
label.sw2 input:checked{background:var(--acc)}
label.sw2 input:checked::after{transform:translateX(18px)}
.swatches{display:flex;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c)}
.swatches button.on{border-color:var(--ink)}
.list-rows > div{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.list-rows > div:last-child{border-bottom:0}
.list-rows > div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--mut);font-size:14px}
.small{font-size:12.5px;color:var(--faint)}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;background:var(--ambient),var(--bg);z-index:10;display:flex;flex-direction:column;visibility:hidden;opacity:0;pointer-events:none;transform:translateY(40px) scale(.98);transition:transform .42s var(--ease),opacity .3s,visibility 0s .42s}
.sheet.open{visibility:visible;opacity:1;pointer-events:auto;transform:none;transition:transform .42s var(--ease),opacity .3s,visibility 0s}
.sh-top{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid var(--line)}
.sh-top b{flex:1;font-size:17px;text-align:center}
.sh-body{flex:1;overflow:auto;padding:14px 18px 40px;width:100%;max-width:720px;margin:0 auto}
.bs{position:fixed;inset:0;z-index:12;visibility:hidden;transition:visibility 0s .35s}
.bs.open{visibility:visible;transition:none}
.bs .bd{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.bs.open .bd{opacity:1}
.bs .pnl{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--solid);border-radius:26px 26px 0 0;padding:8px 18px calc(var(--safeB) + 18px);transform:translateY(105%);transition:transform .38s var(--ease);max-width:720px;margin:0 auto;box-shadow:var(--sh2)}
.bs.open .pnl{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.bs h3{margin:2px 0 12px;font-size:18px;letter-spacing:-.01em}
.acts button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:14px 4px;font:600 16px/1.2 var(--font);cursor:pointer;border-bottom:1px solid var(--line);text-align:left}
.acts button:last-child{border-bottom:0}
.acts button i{font-style:normal;font-size:20px;width:26px;text-align:center}
.acts button.danger{color:var(--bad)}
#capText{min-height:120px;resize:none;font-size:17px;border:0;background:transparent;padding:4px 0;box-shadow:none}
#capText:focus{box-shadow:none}
.optlabel{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 2px}
.pend{display:flex;gap:6px;flex-wrap:wrap}
.pc{font-size:13px;padding:5px 4px 5px 10px;border-radius:11px;background:var(--acc2);display:flex;gap:4px;align-items:center}
.pc button{border:0;background:none;font-size:13px;padding:0 6px;cursor:pointer}

/* ---------- editor ---------- */
.ed-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ed-chips select,.ed-chips input{width:auto;padding:7px 10px;border-radius:12px;font-size:14px;background:var(--card)}
#eTitle{font-size:26px;font-weight:800;letter-spacing:-.025em;border:0;background:transparent;padding:6px 0;border-radius:0;box-shadow:none}
#eBody{min-height:46vh;resize:none;border:0;background:transparent;padding:4px 0;line-height:1.7;border-radius:0;box-shadow:none}
.edbar{display:flex;gap:4px;overflow-x:auto;padding:8px 12px calc(var(--safeB) + 8px);border-top:1px solid var(--line);background:var(--solid);scrollbar-width:none}
.edbar::-webkit-scrollbar{display:none}
.edbar button{flex:none;min-width:44px;height:40px;border:0;border-radius:11px;background:var(--bg);font:700 15px/1 var(--font);cursor:pointer}
.edbar button:active{background:var(--acc2)}
.prev,.prev *{overflow-wrap:anywhere}
.prev{line-height:1.7;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(5px)}}
.prev h1{font-size:28px;margin:4px 0 12px;line-height:1.2;letter-spacing:-.025em}
.prev h2{font-size:20px;margin:18px 0 6px}.prev h3{font-size:17px;margin:14px 0 4px}.prev h4{font-size:15px;margin:10px 0 4px}
.prev p{margin:4px 0}.prev ul{padding-left:22px;margin:4px 0}
li.ck{list-style:none;margin-left:-22px;display:flex;gap:10px;align-items:flex-start}
li.ck .tick{width:21px;height:21px;margin-top:4px;border-radius:7px}
code{background:var(--acc2);padding:1px 6px;border-radius:6px;font-size:.9em}
.prev a{color:var(--acc)}
a.wl{text-decoration:none;border-bottom:1.5px dashed var(--acc);cursor:pointer}
a.tg{text-decoration:none;cursor:pointer;font-weight:650}
.gap{height:8px}
.lp{display:flex;gap:12px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);margin:12px 0;cursor:pointer;text-decoration:none;color:var(--ink)}
.lp img{width:96px;object-fit:cover;flex:none;background:var(--line)}
.lp div{padding:10px 12px 10px 0;min-width:0}
.lp b{display:block;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lp small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lp em{font-style:normal;font-size:11.5px;color:var(--acc);font-weight:700}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.fi{position:relative}
.fi img,.fi video{max-width:150px;max-height:150px;border-radius:12px;display:block;object-fit:cover;background:var(--line)}
#eFiles .fi img,#eFiles .fi video{max-width:100%;max-height:380px}
.fi.doc a{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--solid);color:var(--ink);text-decoration:none;font-size:14px}
.fx{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;cursor:pointer}

/* ---------- discover ---------- */
.wxbig{display:flex;align-items:center;gap:14px}

<script>

let db = {notes:[], files:{}, cache:{},
  settings:{name:'Second Brain', theme:'auto', accent:'mint', lastExport:0, init:0, autoUpdate:true, lastCheck:0, city:'Bangkok', feeds:FEEDS, wikiLang:'en', fx:{amt:100, from:'USD', to:'THB'}, autoBackup:true, view:'list', sort:'recent'},
  cloud:{session:null, dirty:[], lastPull:'1970-01-01T00:00:00Z', lastSync:0, lastBackup:0, error:''}};
let ui = {tab:'home', para:'all', tag:null, q:'', newsTab:0, anim:true, wikiQ:'', wiki:null, capType:'note', capPara:'inbox', capDue:'', capFiles:[]};
let cur = null, editMode = false;

/* ================= storage ================= */
const Store = {
  idb:null,
  async init(){ try{ this.idb = await new Promise((res,rej)=>{ const r = indexedDB.open('secondbrain',1); r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }catch(e){ this.idb = null; } },
  tx(st, mode, fn){ return new Promise((res,rej)=>{ const t = this.idb.transaction(st, mode); const r = fn(t.objectStore(st)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  async get(k){ if(this.idb) return this.tx('kv','readonly',s=>s.get(k)); const v = localStorage.getItem('sb2.'+k); return v ? JSON.parse(v) : undefined; },
  async set(k,v){ if(this.idb) return this.tx('kv','readwrite',s=>s.put(v,k)); localStorage.setItem('sb2.'+k, JSON.stringify(v)); },
  async putFile(id,b){ if(!this.idb) throw new Error('File storage is not available here'); return this.tx('files','readwrite',s=>s.put(b,id)); },
  async getFile(id){ return this.idb ? this.tx('files','readonly',s=>s.get(id)) : null; },
  async delFile(id){ if(this.idb) return this.tx('files','readwrite',s=>s.delete(id)); }
};
let saveTimer;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 250); }
async function flush(){ clearTimeout(saveTimer); try{ await Store.set('db', JSON.parse(JSON.stringify(db))); }catch(e){ toast('⚠️ Could not save — export a backup'); } }
async function load(){
  await Store.init();
  let d = null; try{ d = await Store.get('db'); }catch(e){}
  if(!d){ try{ const r = localStorage.getItem('secondbrain.v1'); if(r) d = JSON.parse(r); }catch(e){} }
  if(d){
    db.notes = d.notes || []; db.files = d.files || {}; db.cache = d.cache || {};
    Object.assign(db.settings, d.settings || {}); Object.assign(db.cloud, d.cloud || {});
    ['apiKey','model','learn'].forEach(k => delete db.settings[k]);
  }
  if(!Array.isArray(db.settings.feeds) || !db.settings.feeds.length) db.settings.feeds = FEEDS;
}
document.addEventListener('visibilitychange', () => { if(document.hidden) flush(); else { Cloud.sync(); } });

/* ================= helpers ================= */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const valid = (v,keys,def) => keys.includes(v) ? v : def;
const byId = id => db.notes.find(n => n.id===id);
const byTitle = t => db.notes.find(n => (n.title||'').trim().toLowerCase() === t.trim().toLowerCase());
const tagsOf = n => [...new Set([...((n.title||'')+' '+(n.body||'')).matchAll(TAGRE)].map(m => m[2].toLowerCase()))];
const sorted = a => a.slice().sort((x,y) => (y.pinned-x.pinned) || (y.updated-x.updated));
const dstr = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => dstr(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return dstr(d); };
const live = () => db.notes.filter(n => n.para!=='archive');
function ago(t){ const s=(Date.now()-t)/1000; if(s<60)return 'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; if(s<604800)return Math.floor(s/86400)+'d ago'; return new Date(t).toLocaleDateString(); }
function dueLabel(d){ if(!d) return ''; const t = today(); if(d===t) return 'Today'; if(d===addDays(1)) return 'Tomorrow'; if(d===addDays(-1)) return 'Yesterday'; const dt = new Date(d+'T00:00'); return dt.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
let toastT;
function toast(m, action, fn){
  const t = $('#toast'); t.querySelector('span').textContent = m; const b = t.querySelector('button');
  b.textContent = action || ''; b.classList.toggle('hide', !action); b.onclick = () => { t.classList.remove('show'); fn && fn(); };
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), action ? 4500 : 2600);
}
function allTags(){ const m={}; db.notes.forEach(n => tagsOf(n).forEach(t => m[t]=(m[t]||0)+1)); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function markDirty(id){ if(!db.cloud.dirty.includes(id)) db.cloud.dirty.push(id); }
function changed(n){ n.updated = Date.now(); markDirty(n.id); save(); Cloud.soon(); }
function newNote(o={}){ const n = Object.assign({id:uid(),title:'',body:'',type:'note',para:'inbox',pinned:false,done:false,due:'',files:[],created:Date.now(),updated:Date.now()}, o); db.notes.unshift(n); markDirty(n.id); save(); Cloud.soon(); return n; }
function removeNote(n){
  db.notes = db.notes.filter(x => x!==n); markDirty(n.id);
  const used = new Set(db.notes.flatMap(x=>x.files||[]));
  (n.files||[]).forEach(id => { if(!used.has(id)){ Store.delFile(id).catch(()=>{}); } });
  save(); Cloud.soon();
}
async function getJSON(url, opt={}, ms=12000){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try{ const r = await fetch(url, {...opt, signal:c.signal}); const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error || j.msg || j.message || j.error_description || ('error '+r.status)); return j; }
  catch(e){ throw new Error(e.name==='AbortError' ? 'Connection timed out' : e.message); }
  finally{ clearTimeout(t); }
}
const webFn = (type, url) => getJSON(`${SB_URL}/functions/v1/web?type=${type}&url=${encodeURIComponent(url)}`, {headers:{Authorization:'Bearer '+SB_KEY}}, 15000);
function openExternal(url){ const P = NATIVE() && window.Capacitor.Plugins; if(P && P.Browser) P.Browser.open({url}); else window.open(url, '_blank', 'noopener'); }
const b64 = blob => new Promise((res,rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
const dataURL = blob => new Promise((res,rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
async function shareFile(name, blob, title){
  const P = NATIVE() && window.Capacitor.Plugins;
  if(P && P.Filesystem && P.Share){
    try{ const r = await P.Filesystem.writeFile({path:name, data:await b64(blob), directory:'CACHE'}); await P.Share.share({title:title||name, url:r.uri, dialogTitle:title||('Save '+name)}); return true; }
    catch(e){ if(!/cancel/i.test(String(e && e.message))) toast('Could not share: ' + (e && e.message)); return false; }
  }
  try{ const f = new File([blob], name, {type:blob.type}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:title||name}); return true; } }catch(e){ if(e.name==='AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return true;
}
async function shareText(title, text){
  const P = NATIVE() && window.Capacitor.Plugins;
  try{ if(P && P.Share){ await P.Share.share({title, text}); return; } if(navigator.share){ await navigator.share({title, text}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }catch(e){ toast('Sharing is not available here'); }
}

/* ================= theme ================= */
function isDark(){ const t = db.settings.theme; return t==='dark' || (t==='auto' && matchMedia('(prefers-color-scheme: dark)').matches); }
function applyTheme(){
  const r = document.documentElement, dark = isDark(), a = ACCENTS[db.settings.accent] || ACCENTS.mint;
  r.classList.toggle('dark', dark);
  r.style.setProperty('--acc', dark ? a[0] : a[1]); r.style.setProperty('--accInk', dark ? a[2] : '#FFFFFF');
  r.style.setProperty('--acc2', (dark ? a[0] : a[1]) + (dark ? '1F' : '1C'));
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = dark ? '#0A0C10' : '#F2F2EE';
  Neural.color = null;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(db.settings.theme==='auto'){ applyTheme(); render(); } });

/* ================= files ================= */
const urlCache = new Map();
async function fileURL(id){
  if(urlCache.has(id)) return urlCache.get(id);
  let b = await Store.getFile(id).catch(()=>null);
  if(!b && db.files[id] && db.files[id].path && Cloud.on()){ try{ b = await Cloud.download(db.files[id].path); if(b) await Store.putFile(id, b); }catch(e){} }
  if(!b) return null; const u = URL.createObjectURL(b); urlCache.set(id,u); return u;
}
function hydrate(root=document){
  root.querySelectorAll('[data-file]:not([src])').forEach(async el => { const u = await fileURL(el.dataset.file); if(u) el.src = u; });
  root.querySelectorAll('[data-filelink]:not([href])').forEach(async el => { const u = await fileURL(el.dataset.filelink); if(u) el.href = u; });
}
function filesHTML(ids, rm=false){
  if(!ids || !ids.length) return '';
  return '<div class="files">' + ids.map(id => { const f = db.files[id]; if(!f) return '';
    const x = rm ? `<button class="fx" data-unfile="${id}" aria-label="Remove">✕</button>` : '';
    if(f.type.startsWith('image/')) return `<div class="fi"><img data-file="${id}" alt="${esc(f.name)}">${x}</div>`;
    if(f.type.startsWith('video/')) return `<div class="fi"><video data-file="${id}" controls playsinline preload="metadata"></video>${x}</div>`;
    return `<div class="fi doc"><a data-filelink="${id}" download="${esc(f.name)}">📄 ${esc(f.name)}</a>${x}</div>`;
  }).join('') + '</div>';
}
function resizeImage(file, max){ return new Promise((res,rej) => { const img = new Image(), u = URL.createObjectURL(file);
  img.onload = () => { let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max/Math.max(w,h)); w = Math.round(w*s); h = Math.round(h*s);
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
    URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', .85); };
  img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); }; img.src = u; }); }
async function addFile(f){
  let blob = f, name = f.name || 'file';
  if((f.type||'').startsWith('image/')){ try{ blob = await resizeImage(f, 2048); name = name.replace(/\.[^.]+$/,'') + '.jpg'; }catch(e){ throw new Error(name + ': cannot read this image'); } }
  if(blob.size > 80e6) throw new Error(name + ': too large (max 80 MB)');
  const id = uid(); await Store.putFile(id, blob);
  db.files[id] = {name, type:blob.type || 'application/octet-stream', size:blob.size, created:Date.now(), cloud:false};
  save(); Cloud.soon(); return id;
}

/* ================= mini markdown ================= */
function fmt(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" data-ext="$1">$1</a>')
    .replace(TAGRE,(m,a,b)=>`${a}<a class="tg" data-tag="${b.toLowerCase()}">#${b}</a>`);
}
const inline = t => t.split(/(\[\[[^\]]+\]\])/).map((s,i) => i%2 ? `<a class="wl" data-t="${s.slice(2,-2)}">${s.slice(2,-2)}</a>` : fmt(s)).join('');
function md(src){
  let out='', ul=false, ci=0, m;
  const open=()=>{ if(!ul){ out+='<ul>'; ul=true; } }, close=()=>{ if(ul){ out+='</ul>'; ul=false; } };
  for(const l of esc(src).split('\n')){
    if((m = l.match(/^\s*[-*] \[( |x)\] (.*)$/i))){ open(); out+=`<li class="ck"><input type="checkbox" class="tick" data-i="${ci++}" ${m[1]===' '?'':'checked'}><span>${inline(m[2])}</span></li>`; }
    else if((m = l.match(/^\s*(?:[-*]|\d+\.) (.*)$/))){ open(); out+=`<li>${inline(m[1])}</li>`; }
    else { close();
      if((m = l.match(/^(#{1,3}) (.*)$/))) out+=`<h${m[1].length+1}>${inline(m[2])}</h${m[1].length+1}>`;
      else if(!l.trim()) out+='<div class="gap"></div>';
      else out+=`<p>${inline(l)}</p>`;
    }
  }
  close(); return out;
}

/* ================= cloud sync (Supabase) ================= */
const Cloud = {
  busy:false, t:null, state:'idle',
  on(){ return !!(db.cloud.session && db.cloud.session.access_token); },
  user(){ return db.cloud.session && db.cloud.session.user; },
  async auth(path, body){
    return getJSON(`${SB_URL}/auth/v1/${path}`, {method:'POST', headers:{apikey:SB_KEY, 'content-type':'application/json'}, body:JSON.stringify(body)});
  },
  setSession(j){ db.cloud.session = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in||3600)), user:{id:j.user.id, email:j.user.email}}; save(); },
  async signUp(email, pw){ const j = await this.auth('signup', {email, password:pw}); if(j.access_token){ this.setSession(j); return 'in'; } return 'confirm'; },
  async signIn(email, pw){
    const prev = db.cloud.lastUser;
    this.setSession(await this.auth('token?grant_type=password', {email, password:pw}));
    if(prev && prev !== this.user().id) db.cloud.lastPull = '1970-01-01T00:00:00Z';
    db.cloud.lastUser = this.user().id;
    db.notes.forEach(n => markDirty(n.id)); Object.values(db.files).forEach(f => { if(f.owner !== this.user().id) f.cloud = false; });
    save(); await this.sync(true);
  },
  async reset(email){ await this.auth('recover', {email}); },
  signOut(){ db.cloud.session = null; db.cloud.error = ''; this.state = 'idle'; save(); },
  async token(){
    const s = db.cloud.session; if(!s) throw new Error('Not signed in');
    if(s.expires_at*1000 - Date.now() < 90e3){
      try{ this.setSession(await this.auth('token?grant_type=refresh_token', {refresh_token:s.refresh_token})); }
      catch(e){ if(/invalid|expired|not found/i.test(e.message)){ this.signOut(); throw new Error('Session expired — please sign in again'); } throw e; }
    }
    return db.cloud.session.access_token;
  },
  async rest(path, opt={}){
    const tk = await this.token();
    const r = await fetch(`${SB_URL}/rest/v1/${path}`, {...opt, headers:{apikey:SB_KEY, Authorization:'Bearer '+tk, 'content-type':'application/json', ...(opt.headers||{})}});
    if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.message || ('sync error '+r.status)); }
    if(r.status===204) return null;
    const txt = await r.text(); return txt ? JSON.parse(txt) : null;
  },
  async upload(path, blob){
    const tk = await this.token();
    const r = await fetch(`${SB_URL}/storage/v1/object/brain/${path}`, {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer '+tk, 'content-type':blob.type||'application/octet-stream', 'x-upsert':'true'}, body:blob});
    if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.message || j.error || ('upload error '+r.status)); }
  },
  async download(path){
    const tk = await this.token();
    const r = await fetch(`${SB_URL}/storage/v1/object/authenticated/brain/${path}`, {headers:{apikey:SB_KEY, Authorization:'Bearer '+tk}});
    return r.ok ? r.blob() : null;
  },
  soon(){ if(!this.on()) return; clearTimeout(this.t); this.t = setTimeout(() => this.sync(), 2500); },
  async sync(force){
    if(!this.on() || this.busy) return;
    if(!navigator.onLine){ this.state = 'offline'; paintSync(); return; }
    this.busy = true; this.state = 'busy'; paintSync();
    try{
      const me = this.user().id;
      // 1) pull changes from other devices
      let pulled = 0;
      for(let page=0; page<20; page++){
        const rows = await this.rest(`notes?select=id,data,updated,deleted,synced_at&synced_at=gt.${encodeURIComponent(db.cloud.lastPull)}&order=synced_at.asc&limit=500`);
        if(!rows || !rows.length) break;
        for(const r of rows){
          const local = byId(r.id), pending = db.cloud.dirty.includes(r.id);
          db.cloud.lastPull = r.synced_at;
          if(pending && (!local || (local.updated||0) >= r.updated)) continue; // our own newer change (or deletion) wins
          if(r.deleted){ if(local && (local.updated||0) <= r.updated){ db.notes = db.notes.filter(x => x!==local); db.cloud.dirty = db.cloud.dirty.filter(x => x!==r.id); pulled++; } }
          else if(!local || r.updated > (local.updated||0)){
            const n = Object.assign({files:[]}, r.data, {id:r.id});
            if(local) Object.assign(local, n); else db.notes.push(n);
            db.cloud.dirty = db.cloud.dirty.filter(x => x!==r.id); pulled++;
          }
        }
        if(rows.length < 500) break;
      }
      const frows = await this.rest(`files?select=id,name,type,size,path&order=created.asc&limit=5000`) || [];
      for(const f of frows){ if(!db.files[f.id]) db.files[f.id] = {name:f.name, type:f.type, size:f.size, path:f.path, cloud:true, owner:me, created:Date.now()}; else Object.assign(db.files[f.id], {path:f.path, cloud:true, owner:me}); }
      // 2) upload new files
      for(const [id, f] of Object.entries(db.files)){
        if(f.cloud && f.owner===me) continue;
        if(!db.notes.some(n => (n.files||[]).includes(id))) continue;
        const b = await Store.getFile(id).catch(()=>null); if(!b || b.size > 50e6) continue;
        const path = `${me}/files/${id}`;
        await this.upload(path, b);
        await this.rest('files?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify([{id, name:f.name, type:f.type, size:f.size, path}])});
        Object.assign(f, {path, cloud:true, owner:me});
      }
      // 3) push local changes
      const ids = db.cloud.dirty.slice();
      for(let i=0; i<ids.length; i+=200){
        const rows = ids.slice(i,i+200).map(id => { const n = byId(id); return n ? {id, data:n, updated:n.updated||Date.now(), deleted:false} : {id, data:{}, updated:Date.now(), deleted:true}; });
        await this.rest('notes?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(rows)});
      }
      db.cloud.dirty = db.cloud.dirty.filter(id => !ids.includes(id));
      db.cloud.lastSync = Date.now(); db.cloud.error = ''; this.state = 'ok';
      save();
      if(pulled) render();
      this.autoBackup();
    }catch(e){ db.cloud.error = e.message; this.state = 'err'; save(); if(force) toast('Sync problem: ' + e.message); }
    finally{ this.busy = false; paintSync(); }
  },
  async autoBackup(force){
    if(!this.on() || (!force && (!db.settings.autoBackup || Date.now() - (db.cloud.lastBackup||0) < 23*3600e3))) return;
    try{
      const me = this.user().id, blob = new Blob([JSON.stringify(backupData(false))], {type:'application/json'});
      await this.upload(`${me}/backups/backup-${today()}.json`, blob);
      db.cloud.lastBackup = Date.now(); save();
      const tk = await this.token();
      const list = await getJSON(`${SB_URL}/storage/v1/object/list/brain`, {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer '+tk, 'content-type':'application/json'}, body:JSON.stringify({prefix:`${me}/backups/`, limit:100, sortBy:{column:'name', order:'desc'}})});
      const old = (list||[]).map(o => `${me}/backups/${o.name}`).slice(14);
      if(old.length) await fetch(`${SB_URL}/storage/v1/object/brain`, {method:'DELETE', headers:{apikey:SB_KEY, Authorization:'Bearer '+tk, 'content-type':'application/json'}, body:JSON.stringify({prefixes:old})});
      if(force) toast('☁️ Backup saved to your cloud');
    }catch(e){ if(force) toast('Cloud backup failed: ' + e.message); }
  }
};
function syncDotClass(){ if(!Cloud.on()) return ''; return {busy:'busy', ok:'ok', err:'err'}[Cloud.state] || (db.cloud.dirty.length ? 'busy' : 'ok'); }
function paintSync(){ document.querySelectorAll('.sdot').forEach(d => d.className = 'sdot ' + syncDotClass()); const el = $('#syncLine'); if(el) el.innerHTML = syncLine(); }
function syncLine(){
  if(!Cloud.on()) return 'Not signed in — notes are saved on this device only.';
  if(Cloud.state==='busy') return 'Syncing…';
  if(Cloud.state==='offline' || !navigator.onLine) return 'Offline — changes will sync when you are back online.';
  if(db.cloud.error) return '⚠️ ' + esc(db.cloud.error);
  return `✓ Synced ${db.cloud.lastSync ? ago(db.cloud.lastSync) : ''}${db.cloud.dirty.length ? ` · ${db.cloud.dirty.length} waiting` : ''}`;
}

const WX = c => c===0?['☀️','Clear']:c<=2?['🌤️','Partly cloudy']:c===3?['☁️','Cloudy']:c<=48?['🌫️','Fog']:c<=57?['🌦️','Drizzle']:c<=67?['🌧️','Rain']:c<=77?['🌨️','Snow']:c<=82?['🌧️','Showers']:c<=86?['🌨️','Snow showers']:['⛈️','Thunderstorm'];
async function loadWeather(force){
  const c = db.cache.weather;
  if(!force && c && c.city===db.settings.city && Date.now()-c.at < 30*60e3) return c;

    const w = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`);

/* ================= self-update from GitHub ================= */
const Upd = {
  open(){ return new Promise((res,rej) => { const r = indexedDB.open('sb-updater',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async run(mode, fn){ const d = await this.open(); return new Promise((res,rej) => { const t = d.transaction('kv', mode); const q = fn(t.objectStore('kv')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); },
  put(v){ return this.run('readwrite', s => s.put(v,'app')); },
  clear(){ return this.run('readwrite', s => s.delete('app')); }
};
const newer = (a,b) => { a = String(a).split('.').map(Number); b = String(b).split('.').map(Number); for(let i=0;i<3;i++){ if((a[i]||0)!==(b[i]||0)) return (a[i]||0) > (b[i]||0); } return false; };
let upd = {};
async function checkUpdate(manual){
  if(!navigator.onLine){ if(manual) toast("You're offline"); return; }
  try{
    if(manual) toast('Checking for updates…');
    const r = await fetch(RAW + 'version.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status===404 ? 'update server not reachable (is the GitHub repo public?)' : 'update server answered ' + r.status);
    const v = await r.json(); db.settings.lastCheck = Date.now(); save();
    const shell = window.SB_SHELL || {};
    upd.apk = NATIVE() && v.apk_version && shell.apk && newer(v.apk_version, shell.apk) ? v : null;
    if(!newer(v.version, APP_VERSION) || (upd.ready && upd.ready.version===v.version)){
      if(manual) toast(upd.ready ? `Version ${upd.ready.version} is ready — restart to use it` : `✅ You have the latest version (${APP_VERSION})`);
    } else if(manual || db.settings.autoUpdate){
      if(manual) toast(`Downloading version ${v.version}…`);
      const h = await (await fetch(RAW + 'app.html?t=' + Date.now(), {cache:'no-store'})).text();
      if(!h.includes(`APP_VERSION = '${v.version}'`)) throw new Error('the download was incomplete, try again in a few minutes');
      await Upd.put({version:v.version, html:h, at:Date.now()});
      upd.ready = v; upd.available = null; toast(`✨ Version ${v.version} is ready`, 'Restart', () => act('restart'));
    } else upd.available = v;
    if(ui.tab==='home') render(); if($('#me').classList.contains('open')) renderMe();
  }catch(e){ if(manual) toast('Update failed: ' + e.message); }
}
function updateBanner(){
  if(upd.ready) return `<div class="banner">✨ <span>Version ${esc(upd.ready.version)} is ready${upd.ready.notes?' — '+esc(upd.ready.notes):''}</span><button class="btn sm" data-act="restart">Restart</button></div>`;
  if(upd.available) return `<div class="banner">⬆️ <span>Version ${esc(upd.available.version)} is available</span><button class="btn sm" data-act="checkUpd">Update</button></div>`;
  if(upd.apk) return `<div class="banner">📦 <span>New Android app ${esc(upd.apk.apk_version)} available</span><button class="btn sm" data-act="getApk">Get it</button></div>`;
  return '';
}

/* ================= backup ================= */
function backupData(withFiles){ return {app:'second-brain', version:4, exported:Date.now(), notes:db.notes, settings:{...db.settings}, filesMeta:db.files}; }
async function backupBlob(){
  const out = backupData(true), files = {};
  for(const id of Object.keys(db.files)){ const m = db.files[id]; if(m.size > 25e6) continue; const b = await Store.getFile(id).catch(()=>null); if(b) files[id] = {name:m.name, type:m.type, size:m.size, data:await dataURL(b)}; }
  out.files = files; return new Blob([JSON.stringify(out)], {type:'application/json'});
}
async function exportBackup(title){
  toast('Preparing backup…');
  const ok = await shareFile(`second-brain-backup-${today()}.json`, await backupBlob(), title);
  if(ok){ db.settings.lastExport = Date.now(); save(); if($('#me').classList.contains('open')) renderMe(); }
}
async function importBackup(file){
  try{
    const d = JSON.parse(await file.text()); if(!Array.isArray(d.notes)) throw 0;
    let add=0, upd2=0, nf=0;
    for(const [id, meta] of Object.entries(d.files||{})){ if(db.files[id] || !meta.data) continue; try{ const b = await (await fetch(meta.data)).blob(); await Store.putFile(id, b); db.files[id] = {name:meta.name, type:meta.type, size:meta.size, created:Date.now(), cloud:false}; nf++; }catch(e){} }
    d.notes.forEach(n => {
      if(!n || !n.id) return; const ex = byId(n.id);
      if(!ex){ db.notes.push(Object.assign({title:'',body:'',type:'note',para:'inbox',pinned:false,done:false,files:[],created:Date.now(),updated:Date.now()}, n)); markDirty(n.id); add++; }
      else if((n.updated||0) > (ex.updated||0)){ Object.assign(ex, n); markDirty(n.id); upd2++; }
    });
    save(); render(); Cloud.soon(); toast(`Restored: ${add} new, ${upd2} updated, ${nf} files`);
  }catch(err){ toast('That is not a valid backup file'); }
}

function insertMd(tpl){
  const ta = $('#eBody'), s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s,e);
  let ins, caret;
  if(tpl.includes('|')){ const [a,b] = tpl.split('|'); ins = a + sel + b; caret = s + a.length + sel.length; }
  else if(tpl.endsWith(' ')){ const ls = ta.value.lastIndexOf('\n', s-1) + 1; ta.setRangeText(tpl, ls, ls, 'end'); caret = s + tpl.length; ta.selectionStart = ta.selectionEnd = caret; ta.focus(); cur.body = ta.value; changed(cur); return; }
  else { ins = tpl + sel; caret = s + ins.length; }
  ta.setRangeText(ins, s, e, 'end'); ta.selectionStart = ta.selectionEnd = caret; ta.focus(); cur.body = ta.value; changed(cur);
}

$('#noteFile').addEventListener('change', async e => { if(cur) await attachTo(cur, [...e.target.files]); e.target.value=''; });
$('#notePhoto').addEventListener('change', async e => { if(cur) await attachTo(cur, [...e.target.files]); e.target.value=''; });
function toggleCheck(i){ let k=0; cur.body = cur.body.replace(/^(\s*[-*] \[)( |x|X)(\] )/gm,(m,a,b,c)=> k++===i ? a+(b===' '?'x':' ')+c : m); changed(cur); showEditor(); }

/* ================= quick capture ================= */
function openCapture(o={}){
  ui.capType = o.type || (ui.tab==='tasks' ? 'task' : 'note');
  ui.capPara = o.para || (PK.includes(ui.para) && ui.tab==='library' ? ui.para : 'inbox');
  ui.capDue = o.due ?? (ui.capType==='task' ? '' : '');
  ui.capFiles = o.files || [];
  $('#capText').value = o.text || '';
  paintCapture(); openSheet('capSheet');
  if(!o.files) setTimeout(() => $('#capText').focus(), 120);
}
function paintCapture(){
  $('#capTypes').innerHTML = TYPES.filter(t=>t[0]!=='journal').map(t => `<button class="chip ${ui.capType===t[0]?'on':''}" data-captype="${t[0]}">${t[2]} ${t[1]}</button>`).join('');
  $('#capPara').innerHTML = PARA.slice(0,4).map(p => `<button class="chip ${ui.capPara===p[0]?'on':''}" data-cappara="${p[0]}">${p[2]} ${p[1]}</button>`).join('');
  $('#capTaskOpts').classList.toggle('hide', ui.capType!=='task');
  const dues = [['','No date'],[today(),'Today'],[addDays(1),'Tomorrow'],[addDays(7),'Next week']];
  const custom = ui.capDue && !dues.some(d=>d[0]===ui.capDue);
  $('#capDue').innerHTML = dues.map(([k,l]) => `<button class="chip ${ui.capDue===k?'on':''}" data-capdue="${k}">${l}</button>`).join('') + `<button class="chip ${custom?'on':''}" data-act="capPickDate">📅 ${custom?dueLabel(ui.capDue):'Pick date'}</button>`;
  $('#capFiles').innerHTML = ui.capFiles.map((f,i) => `<span class="pc">${(f.type||'').startsWith('image/')?'🖼️':'📄'} ${esc((f.name||'file').slice(0,22))}<button data-unpend="${i}" aria-label="Remove">✕</button></span>`).join('');
}
async function saveCapture(){
  const v = $('#capText').value.trim();
  if(!v && !ui.capFiles.length){ toast('Write something first'); return; }
  const lines = v.split('\n'), first = lines[0].trim();
  let title = first.length > 90 ? first.slice(0,90)+'…' : first, body = first.length > 90 ? v : lines.slice(1).join('\n').trim();
  const url = (v.match(URLRE)||[])[0];
  if(!title && ui.capFiles.length) title = ((ui.capFiles[0].type||'').startsWith('image/') ? 'Photo · ' : 'File · ') + new Date().toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  let type = ui.capType; if(url && type==='note' && v.trim()===url) type = 'link';
  if(url && v.trim()===url){ title = url; body = url; }
  const n = newNote({title, body, type, para:type==='link' && ui.capPara==='inbox' ? 'resources' : ui.capPara, due:type==='task' ? ui.capDue : ''});
  const files = ui.capFiles; ui.capFiles = [];
  closeSheet('capSheet'); ui.anim = true;
  if(files.length) await attachTo(n, files);
  render(); toast(`${TYPE[type].i} Saved`, 'Open', () => openNote(n.id));
  fetchPreview(n);
}
$('#capPick').addEventListener('change', e => { ui.capFiles.push(...e.target.files); e.target.value=''; paintCapture(); });
$('#capCam').addEventListener('change', e => { ui.capFiles.push(...e.target.files); e.target.value=''; if(!$('#capSheet').classList.contains('open')) openCapture({type:'note', files:ui.capFiles}); else paintCapture(); });
$('#capDate').addEventListener('change', e => { ui.capDue = e.target.value; paintCapture(); });

/* ================= actions ================= */
async function act(a, el){
  if(a==='capture') openCapture();
  else if(a==='capSave') saveCapture();
  else if(a==='closeBs'){ const t = topOpen(); if(t) closeSheet(t); }
  else if(a==='capPickDate'){ const d = $('#capDate'); d.value = ui.capDue || today(); try{ d.showPicker(); }catch(e){ const v = prompt('Due date (YYYY-MM-DD)', d.value); if(v){ ui.capDue = v; paintCapture(); } } }
  else if(a==='newTask') openCapture({type:'task', due:today()});
  else if(a==='newLink') openCapture({type:'link', para:'resources'});
  else if(a==='scan'){ $('#capCam').click(); }
  else if(a==='today'){
    let n = db.notes.find(n => n.type==='journal' && n.date===today());
    if(!n) n = newNote({type:'journal', para:'areas', date:today(), title:'Journal · ' + new Date().toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'}), body:'## Wins\n- \n\n## Thoughts\n\n\n## Tomorrow\n- [ ] '});
    openNote(n.id, true);
  }
  else if(a==='close') closeSheet('editor');
  else if(a==='toggle'){ editMode = !editMode; showEditor(); if(editMode) $('#eBody').focus(); }
  else if(a==='pin'){ cur.pinned = !cur.pinned; changed(cur); showEditor(); toast(cur.pinned?'Pinned':'Unpinned'); }
  else if(a==='noteMore'){ const id = cur.id; noteActions(id); }
  else if(a==='addFile') $('#noteFile').click();
  else if(a==='addPhoto') $('#notePhoto').click();
  else if(a==='openMe'){ renderMe(); openSheet('me'); }
  else if(a==='closeMe') closeSheet('me');
  else if(a==='syncNow'){ await Cloud.sync(true); renderMe(); if(Cloud.state==='ok') toast('✓ Synced'); }
  else if(a==='cloudBackup'){ await Cloud.autoBackup(true); renderMe(); }
  else if(a==='signOut'){ if(confirm('Sign out? Your notes stay on this device.')){ Cloud.signOut(); renderMe(); render(); } }
  else if(a==='forgot'){ const e = ($('#aEmail')||{}).value || prompt('Your email'); if(e){ try{ await Cloud.reset(e.trim()); toast('📧 Check your email for a reset link'); }catch(err){ toast(err.message); } } }
  else if(a==='driveBackup') exportBackup('Save backup to Google Drive');
  else if(a==='export') exportBackup();
  else if(a==='import') $('#importFile').click();
  else if(a==='md'){ const txt = sorted(db.notes).map(n => `# ${n.title||'Untitled'}\n\n_${TYPE[n.type].l} · ${PAR[n.para].l} · ${new Date(n.updated).toLocaleString()}_\n\n${n.body}\n`).join('\n---\n\n'); shareFile(`second-brain-${today()}.md`, new Blob([txt], {type:'text/markdown'})); }
  else if(a==='checkUpd') checkUpdate(true);
  else if(a==='restart'){ await flush(); location.reload(); }
  else if(a==='getApk') openExternal(APK_URL);
  else if(a==='resetUpd'){ if(confirm('Go back to the version built into this app? Notes are not affected.')){ await Upd.clear().catch(()=>{}); upd = {}; await flush(); location.reload(); } }
  else if(a==='reset'){ if(prompt('This erases all notes and files on THIS device (your cloud copy stays). Type DELETE to confirm.')==='DELETE'){ for(const id of Object.keys(db.files)) await Store.delFile(id).catch(()=>{}); db.notes=[]; db.files={}; db.cloud.dirty=[]; db.cloud.lastPull='1970-01-01T00:00:00Z'; save(); renderMe(); render(); toast('This device was erased'); } }
  else if(a==='setCity'){ const c = prompt('City for weather', db.settings.city); if(c && c.trim()){ db.settings.city = c.trim(); save(); await loadWeather(true); render(); } }
  else if(a==='fxSwap'){ const F = db.settings.fx; [F.from, F.to] = [F.to, F.from]; save(); render(); }
  else if(a==='refreshNews'){ toast('Refreshing…'); await refreshDiscover(true); }
  else if(a==='wikiClear'){ ui.wiki = null; ui.wikiQ = ''; render(); }
  else if(a==='addFeed'){ const url = prompt('RSS feed address (https://…)'); if(!url) return; const name = prompt('Name for this feed', new URL(url).hostname.replace(/^www\./,'')) || 'Feed'; db.settings.feeds.push({name, url}); save(); renderMe(); }
  else if(a==='resetFeeds'){ db.settings.feeds = FEEDS.slice(); save(); renderMe(); }
  else if(a==='clearDone'){ const done = db.notes.filter(n => n.type==='task' && n.done && n.para!=='archive'); done.forEach(n => { n.para = 'archive'; changed(n); }); render(); toast(`Archived ${done.length} tasks`); }
}

document.addEventListener('click', e => {
  const t = e.target;
  if(Date.now() - swipeEnd < 350) { e.preventDefault(); return; }
  const ai = t.closest('[data-actidx]');
  if(ai){ const it = actions.items[+ai.dataset.actidx]; closeSheet('actSheet'); setTimeout(() => it.fn(), 60); return; }
  if(t.matches('#ePrev .tick')){ toggleCheck(+t.dataset.i); return; }
  const tick = t.closest('[data-tick]');
  if(tick){ const n = byId(tick.dataset.tick); n.done = tick.checked; changed(n); if(n.done){ toast('✓ Done', 'Undo', () => { n.done = false; changed(n); render(); }); } setTimeout(render, n.done ? 350 : 0); return; }
  const ext = t.closest('[data-ext]');
  if(ext && !t.closest('[data-savenews]')){ e.preventDefault(); openExternal(ext.dataset.ext); return; }
  const sn = t.closest('[data-savenews]');
  if(sn){ e.preventDefault(); e.stopPropagation(); const feed = db.settings.feeds[ui.newsTab], it = db.cache.news[feed.url].items[+sn.dataset.savenews]; saveLink(it.link, it.title); return; }
  const g = t.closest('[data-google]'); if(g){ openExternal('https://www.google.com/search?q=' + encodeURIComponent(g.dataset.google)); return; }
  const tab = t.closest('[data-tab]'); if(tab){ if(ui.tab===tab.dataset.tab) scrollTo({top:0, behavior:'smooth'}); else { ui.tab = tab.dataset.tab; ui.anim = true; render(); scrollTo(0,0); if(ui.tab==='discover') refreshDiscover(); } return; }
  const go = t.closest('[data-go]'); if(go){ const k = go.dataset.go; ui.anim = true; if(k==='inbox'){ ui.tab = 'library'; ui.para = 'inbox'; } else ui.tab = k; render(); scrollTo(0,0); return; }
  const ch = t.closest('[data-para]'); if(ch){ ui.para = ch.dataset.para; ui.anim = true; render(); return; }
  const tg = t.closest('[data-tag]'); if(tg){ const k = tg.dataset.tag; ui.tab = 'library'; ui.tag = ui.tag===k && !t.closest('#editor') ? null : k; ui.anim = true; if(topOpen()==='editor') closeSheet('editor'); else render(); return; }
  const so = t.closest('[data-sort]'); if(so){ db.settings.sort = so.dataset.sort; save(); render(); return; }
  const vm = t.closest('[data-viewmode]'); if(vm){ db.settings.view = vm.dataset.viewmode; save(); ui.anim = true; render(); return; }
  const nw = t.closest('[data-news]'); if(nw){ ui.newsTab = +nw.dataset.news; render(); refreshDiscover(); return; }
  const ct = t.closest('[data-captype]'); if(ct){ ui.capType = ct.dataset.captype; if(ui.capType==='link' && ui.capPara==='inbox') ui.capPara = 'resources'; paintCapture(); return; }
  const cp = t.closest('[data-cappara]'); if(cp){ ui.capPara = cp.dataset.cappara; paintCapture(); return; }
  const cd = t.closest('[data-capdue]'); if(cd){ ui.capDue = cd.dataset.capdue; paintCapture(); return; }
  const up = t.closest('[data-unpend]'); if(up){ ui.capFiles.splice(+up.dataset.unpend, 1); paintCapture(); return; }
  const un = t.closest('[data-unfile]'); if(un){ cur.files = cur.files.filter(id => id!==un.dataset.unfile); changed(cur); showEditor(); return; }
  const th = t.closest('[data-theme]'); if(th){ db.settings.theme = th.dataset.theme; save(); applyTheme(); renderMe(); render(); return; }
  const ac = t.closest('[data-accent]'); if(ac){ db.settings.accent = ac.dataset.accent; save(); applyTheme(); renderMe(); render(); return; }
  const df = t.closest('[data-delfeed]'); if(df){ db.settings.feeds.splice(+df.dataset.delfeed, 1); if(!db.settings.feeds.length) db.settings.feeds = FEEDS.slice(); ui.newsTab = 0; save(); renderMe(); return; }
  const mdb = t.closest('[data-md]'); if(mdb){ e.preventDefault(); insertMd(mdb.dataset.md); return; }
  const wl = t.closest('a.wl'); if(wl){ const title = wl.dataset.t; openNote((byTitle(title) || newNote({title})).id); return; }
  const a = t.closest('[data-act]'); if(a){ act(a.dataset.act, a); return; }
  const fl = t.closest('[data-filelink]'); if(fl && NATIVE()){ e.preventDefault(); const id = fl.dataset.filelink; fileURL(id).then(async u => { if(u){ const b = await (await fetch(u)).blob(); shareFile((db.files[id]||{}).name || 'file', b); } }); return; }
  const c = t.closest('.card, .mini'); if(c && !t.closest('a') && !t.closest('video')) openNote(c.dataset.id);
});
document.addEventListener('contextmenu', e => { const c = e.target.closest('.card'); if(c){ e.preventDefault(); noteActions(c.dataset.id); } });
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id==='libQ'){ ui.q = t.value; const pos = t.selectionStart; render(); const n = $('#libQ'); n.focus(); n.setSelectionRange(pos,pos); }
  else if(t.id==='fxAmt' || t.id==='fxFrom' || t.id==='fxTo'){ const F = db.settings.fx; F.amt = $('#fxAmt').value; F.from = $('#fxFrom').value; F.to = $('#fxTo').value; save(); const fx = db.cache.fx; if(fx){ const v = (+F.amt||0) / fx.rates[F.from] * fx.rates[F.to]; $('#fxOut').textContent = v.toLocaleString(undefined,{maximumFractionDigits:2}) + ' ' + F.to; } }
  else if(t.id==='sName'){ db.settings.name = t.value.trim() || 'Second Brain'; document.title = db.settings.name; save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='sAuto'){ db.settings.autoUpdate = t.checked; save(); }
  else if(t.id==='sAutoBk'){ db.settings.autoBackup = t.checked; save(); }
  else if(t.id==='sCity'){ db.settings.city = t.value.trim() || 'Bangkok'; save(); loadWeather(true); }

async function runWiki(q){ ui.wikiQ = q; if(!navigator.onLine){ toast('Search needs internet'); return; } try{ ui.wiki = await wikiSearch(q); }catch(err){ toast('Search failed: ' + err.message); ui.wiki = []; } render(); }
document.addEventListener('submit', async e => {
  e.preventDefault();
  if(e.target.id==='wikiForm'){ const q = $('#wikiQ').value.trim(); if(q) runWiki(q); $('#wikiQ').blur(); }
  if(e.target.id==='authForm'){
    const mode = (e.submitter && e.submitter.dataset.mode) || 'in', email = $('#aEmail').value.trim(), pw = $('#aPass').value;
    const btns = e.target.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
    try{
      if(mode==='up'){ const r = await Cloud.signUp(email, pw); if(r==='confirm'){ toast('📧 Check your email and tap the confirmation link, then sign in here'); } else { await Cloud.signIn(email, pw); toast('Welcome! Your notes are syncing'); } }
      else { await Cloud.signIn(email, pw); toast('✓ Signed in — syncing your notes'); }
    }catch(err){ toast(/confirm/i.test(err.message) ? 'Please confirm your email first (check your inbox)' : /invalid/i.test(err.message) ? 'Wrong email or password' : err.message); }
    btns.forEach(b => b.disabled = false); renderMe(); render();
  }
});
$('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if(f) importBackup(f); e.target.value = ''; });

/* ================= swipe & long press ================= */
let sw = null, swipeEnd = 0, lpT = null;
document.addEventListener('touchstart', e => {
  const c = e.target.closest('.sw > .card'); if(!c || e.target.closest('.tick')) return;
  const p = e.touches[0]; sw = {c, x:p.clientX, y:p.clientY, dx:0, active:false};
  lpT = setTimeout(() => { if(sw && !sw.active){ const id = sw.c.dataset.id; sw = null; swipeEnd = Date.now() + 400; navigator.vibrate && navigator.vibrate(12); noteActions(id); } }, 500);
}, {passive:true});
document.addEventListener('touchmove', e => {
  if(!sw) return; const p = e.touches[0], dx = p.clientX - sw.x, dy = p.clientY - sw.y;
  if(!sw.active){
    if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)*1.4){ sw.active = true; clearTimeout(lpT); sw.c.classList.add('drag'); }
    else if(Math.abs(dy) > 10 || Math.abs(dx) > 12){ clearTimeout(lpT); sw = null; return; }
    else return;
  }
  e.preventDefault(); sw.dx = dx;
  sw.c.style.transform = `translateX(${dx}px)`;
  const w = sw.c.parentNode; w.classList.toggle('swl', dx > 0); w.classList.toggle('swr', dx < 0);
}, {passive:false});
document.addEventListener('touchend', () => {
  clearTimeout(lpT); if(!sw) return;
  const {c, dx, active} = sw; sw = null; if(!active) return;
  swipeEnd = Date.now(); c.classList.remove('drag'); c.style.transform = '';
  setTimeout(() => c.parentNode && c.parentNode.classList.remove('swl','swr'), 300);
  const n = byId(c.dataset.id); if(!n) return;
  if(dx > 90){ n.pinned = !n.pinned; changed(n); toast(n.pinned ? '📌 Pinned' : 'Unpinned'); setTimeout(render, 250); }
  else if(dx < -90){ setTimeout(() => archiveWithUndo(n), 200); }
});

/* ================= 3D neural sphere ================= */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Neural = {
  c:null, x:null, pts:[], n:0, rx:.35, ry:0, drag:null, pulseT:0, raf:0, color:null, t:0,
  mount(c){
    this.c = c; if(!c) return; this.x = c.getContext('2d');
    const n = Math.min(140, 46 + db.notes.length*3); if(n!==this.n) this.build(n);
    this.size();
    c.onpointerdown = e => { this.drag = {x:e.clientX, y:e.clientY}; };
    c.onpointermove = e => { if(!this.drag) return; const dx = e.clientX-this.drag.x, dy = e.clientY-this.drag.y;
      if(e.pointerType!=='mouse' && Math.abs(dy) > Math.abs(dx)*1.4){ this.drag = null; return; }
      this.ry += dx*.01; this.rx = Math.max(-1.2, Math.min(1.2, this.rx + dy*.006)); this.drag = {x:e.clientX, y:e.clientY}; };
    c.onpointerup = c.onpointercancel = c.onpointerleave = () => { this.drag = null; };
    if(!this.raf) this.loop();
  },
  build(n){ this.n = n; this.pts = []; const g = Math.PI*(3-Math.sqrt(5)); for(let i=0;i<n;i++){ const y = 1-(i/(n-1))*2, r = Math.sqrt(1-y*y), a = g*i; this.pts.push({x:Math.cos(a)*r, y, z:Math.sin(a)*r, ph:Math.random()*6.28}); } },
  size(){ const d = Math.min(devicePixelRatio||1, 2), r = this.c.getBoundingClientRect(); this.w = r.width; this.h = r.height; this.c.width = r.width*d; this.c.height = r.height*d; this.x.setTransform(d,0,0,d,0,0); },
  pulse(){ this.pulseT = 1; },
  loop(){
    this.raf = requestAnimationFrame(() => this.loop());
    const c = this.c; if(!c || !c.isConnected || document.hidden || document.body.classList.contains('sheet-open')) return;
    if(!this.color){ const cs = getComputedStyle(document.documentElement); this.color = cs.getPropertyValue('--acc').trim(); this.warm = cs.getPropertyValue('--warm').trim(); }
    this.t += .016; if(!this.drag && !REDUCED) this.ry += .003; this.pulseT *= .95;
    const x = this.x, w = this.w, h = this.h, cx = w*.74, cy = h*.5, R = Math.min(w*.28, h*.4)*(1+this.pulseT*.12);
    const sy = Math.sin(this.ry), cy_ = Math.cos(this.ry), sx = Math.sin(this.rx), cx_ = Math.cos(this.rx);
    x.clearRect(0,0,w,h);
    const g = x.createRadialGradient(cx,cy,0,cx,cy,R*1.6); g.addColorStop(0, this.color+'33'); g.addColorStop(1, this.color+'00'); x.fillStyle = g; x.fillRect(0,0,w,h);
    const P = this.pts.map(p => { const x1 = p.x*cy_ - p.z*sy, z1 = p.x*sy + p.z*cy_, y1 = p.y*cx_ - z1*sx, z2 = p.y*sx + z1*cx_, s = 2.4/(2.4 - z2); return {X:cx + x1*R*s, Y:cy + y1*R*s, z:z2, s, ph:p.ph, ox:x1, oy:y1}; });
    x.lineWidth = .7; x.strokeStyle = this.color;
    for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){ const a = P[i], b = P[j], dx = a.ox-b.ox, dy = a.oy-b.oy, dz = a.z-b.z, d2 = dx*dx+dy*dy+dz*dz; if(d2 < .2){ x.globalAlpha = (1 - d2/.2) * (.08 + (a.z+b.z+2)*.09); x.beginPath(); x.moveTo(a.X,a.Y); x.lineTo(b.X,b.Y); x.stroke(); } }
    for(const p of P){ const fire = Math.max(0, Math.sin(this.t*1.3 + p.ph*3)) ** 12, depth = (p.z+1)/2; x.globalAlpha = .25 + depth*.6 + fire*.4; x.fillStyle = fire > .5 ? this.warm : this.color; x.beginPath(); x.arc(p.X, p.Y, (.8 + depth*1.6 + fire*2.2) * p.s, 0, 6.283); x.fill(); }
    x.globalAlpha = 1;
  }
};
